stages:
  - formatting
  - test
  - secret-detection

buildifier:
  stage: formatting

  # Pin the Go image by digest so the CI environment cannot change underneath us if the 1.26.6-bookworm tag is updated.
  image: golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36

  before_script:
    #
    # Build Buildifier from a pinned upstream commit for reproducibility.
    # Clone outside CI_PROJECT_DIR so Buildifier does not recursively check its own source when invoked with "-r .".
    #
    - git clone https://github.com/bazelbuild/buildtools.git /tmp/buildtools
    - cd /tmp/buildtools
    - git checkout f6a1982250030df9c2d24a675a04f150ff6aca6b
    - go install ./buildifier
    - cd "$CI_PROJECT_DIR"

  script:
    #
    # Check formatting and lint recursively without modifying files.
    # Buildifier exits non-zero if any files would be changed or lint fails.
    #
    - buildifier --mode=check --lint=warn -r .

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection
